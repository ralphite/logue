<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logue Extension QA Fixture</title>
    <style>
      :root { color: #242522; font-family: Inter, system-ui, sans-serif; background: #f7f7f5; }
      body { max-width: 760px; margin: 48px auto; padding: 0 20px; }
      main { display: grid; gap: 24px; }
      section { padding: 20px; border: 1px solid #e3e3df; border-radius: 12px; background: white; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      h2 { margin: 0 0 12px; font-size: 14px; }
      p { color: #666762; line-height: 1.6; }
      textarea, [contenteditable] { box-sizing: border-box; display: block; width: 100%; min-height: 112px; padding: 12px; border: 1px solid #d9d9d4; border-radius: 8px; font: inherit; line-height: 1.55; outline: none; }
      textarea:focus, [contenteditable]:focus { border-color: #777fef; box-shadow: 0 0 0 3px #5b64f414; }
      output { display: block; margin-top: 10px; color: #777873; font-size: 12px; }
      .qa-actions { display: flex; justify-content: flex-end; margin-top: 10px; }
      .qa-actions button { height: 32px; padding: 0 10px; border: 1px solid #d9d9d4; border-radius: 6px; background: #fff; color: #666762; font: inherit; font-size: 11px; cursor: pointer; }
      .qa-actions button:hover { background: #f7f7f4; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Logue Extension 真实输入夹具</h1>
        <p>分别聚焦普通输入框与富文本，完成语音插入；提交计数必须始终为 0。下方原文可用于选区语音批注。</p>
      </header>
      <section>
        <h2>普通 input</h2>
        <form data-test-form="input">
          <input aria-label="单行输入框" value="已有单行开头：" style="box-sizing:border-box;width:100%;height:44px;padding:0 12px;border:1px solid #d9d9d4;border-radius:8px;font:inherit;outline:none" />
        </form>
        <output data-test-output="input">提交次数：0</output>
      </section>
      <section>
        <h2>普通 textarea</h2>
        <form data-test-form="textarea">
          <textarea aria-label="普通输入框">已有开头：</textarea>
        </form>
        <div class="qa-actions">
          <button type="button" data-test-replace-target>模拟网页更换输入框</button>
        </div>
        <output data-test-output="textarea">提交次数：0</output>
      </section>
      <section>
        <h2>contenteditable 富文本</h2>
        <form data-test-form="richtext">
          <div contenteditable="true" role="textbox" aria-label="富文本输入框">已有富文本开头：</div>
        </form>
        <output data-test-output="richtext">提交次数：0</output>
      </section>
      <section>
        <h2>选区语音批注原文</h2>
        <p>Logue 的语音输入必须在一次停止操作后自动转写、保存并写入目标，不允许再要求第二次确认。</p>
      </section>
    </main>
    <script>
      for (const form of document.querySelectorAll("form")) {
        let count = 0;
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          count += 1;
          const output = document.querySelector(`[data-test-output="${form.dataset.testForm}"]`);
          if (output) output.textContent = `提交次数：${count}`;
        });
      }
      document.querySelector("[data-test-replace-target]")?.addEventListener("click", () => {
        const form = document.querySelector('[data-test-form="textarea"]');
        const current = form?.querySelector("textarea");
        if (!form || !current) return;
        const replacement = current.cloneNode();
        replacement.value = "新输入框：";
        current.replaceWith(replacement);
      });
    </script>
  </body>
</html>
