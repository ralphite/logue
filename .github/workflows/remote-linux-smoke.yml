name: Remote Linux smoke

on:
  workflow_dispatch:
    inputs:
      hold_minutes:
        description: Keep the temporary QA URL open for this many minutes
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "15"

permissions:
  contents: read

jobs:
  remote-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build the platform-independent release
        run: bash scripts/build-release.sh v0.0.0-remote-smoke

      - name: Install with a Python-only runtime path
        shell: bash
        run: |
          set -Eeuo pipefail
          qa_home="${RUNNER_TEMP}/logue-qa-home"
          install_root="${RUNNER_TEMP}/logue-qa-install"
          data_root="${RUNNER_TEMP}/logue-qa-data"
          asset_root="${RUNNER_TEMP}/logue-qa-assets"
          runtime_bin="${RUNNER_TEMP}/logue-qa-runtime-bin"
          mkdir -p "${qa_home}" "${asset_root}" "${runtime_bin}"
          cp dist/release/logue-python.zip dist/release/checksums.txt "${asset_root}/"
          ln -s "$(command -v python3.13)" "${runtime_bin}/python3.13"
          printf '%s\n' '#!/bin/sh' 'exit 99' > "${runtime_bin}/node"
          cp "${runtime_bin}/node" "${runtime_bin}/go"
          chmod 700 "${runtime_bin}/node" "${runtime_bin}/go"
          runtime_path="${runtime_bin}:/usr/bin:/bin"
          unset GEMINI_API_KEY GOOGLE_GENERATIVE_AI_API_KEY
          HOME="${qa_home}" \
          PATH="${runtime_path}" \
          LOGUE_INSTALL_ROOT="${install_root}" \
          LOGUE_DATA_DIR="${data_root}" \
          LOGUE_BIN_DIR="${qa_home}/.local/bin" \
          LOGUE_ASSET_BASE_URL="file://${asset_root}" \
          LOGUE_ADDRESS="0.0.0.0:8787" \
          LOGUE_AUTO_START=no \
          LOGUE_OPEN_BROWSER=no \
          /bin/bash install.sh
          curl -fsS http://127.0.0.1:8787/v1/status | grep -Fq '"ok":true'
          echo "LOGUE_QA_INSTALL_ROOT=${install_root}" >> "${GITHUB_ENV}"
          echo "LOGUE_QA_DATA_ROOT=${data_root}" >> "${GITHUB_ENV}"

      - name: Download and verify cloudflared 2026.7.2
        shell: bash
        run: |
          set -Eeuo pipefail
          cloudflared="${RUNNER_TEMP}/cloudflared"
          curl -fsSL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-amd64 \
            -o "${cloudflared}"
          echo "ec905ea7b7e327ff8abdde8cb64697a2152de74dbcdbf6aec9db8364eb3886cd  ${cloudflared}" | sha256sum -c -
          file "${cloudflared}" | grep -Fq 'ELF 64-bit'
          chmod 700 "${cloudflared}"
          "${cloudflared}" version

      - name: Open the temporary remote QA URL
        id: tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          cloudflared="${RUNNER_TEMP}/cloudflared"
          tunnel_log="${RUNNER_TEMP}/cloudflared.log"
          remote_url_file="${RUNNER_TEMP}/logue-remote-url.txt"
          cloudflared_pid=""

          cleanup_on_error() {
            if [[ -n "${cloudflared_pid}" ]]; then
              kill "${cloudflared_pid}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_on_error ERR

          "${cloudflared}" tunnel --no-autoupdate --url http://127.0.0.1:8787 \
            >"${tunnel_log}" 2>&1 &
          cloudflared_pid=$!

          remote_url=""
          for _ in $(seq 1 60); do
            remote_url="$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "${tunnel_log}" | head -1 || true)"
            [[ -n "${remote_url}" ]] && break
            kill -0 "${cloudflared_pid}" >/dev/null 2>&1 || {
              cat "${tunnel_log}" >&2
              exit 1
            }
            sleep 1
          done
          [[ -n "${remote_url}" ]] || {
            cat "${tunnel_log}" >&2
            echo "Cloudflare did not provide a temporary URL." >&2
            exit 1
          }
          curl -fsS --retry 12 --retry-delay 1 "${remote_url}/v1/status" | grep -Fq '"ok":true'
          printf '%s\n' "${remote_url}" > "${remote_url_file}"
          echo "LOGUE_QA_TUNNEL_PID=${cloudflared_pid}" >> "${GITHUB_ENV}"
          echo "LOGUE_QA_REMOTE_URL=${remote_url}" >> "${GITHUB_ENV}"
          echo "remote_url=${remote_url}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Logue remote Linux QA"
            echo
            echo "> [!WARNING]"
            echo "> This public URL serves empty temporary QA data only. Do not add real or sensitive data."
            echo
            echo "**Server URL:** \`${remote_url}\`"
            echo
            echo "In the Mac Chrome Extension, open **More options → Server settings**, connect this URL, allow the requested origin, and run the remote recording smoke test."
            echo
            echo "The URL closes automatically after ${{ inputs.hold_minutes }} minutes."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::notice title=Logue remote Linux QA::${remote_url}"
          echo "Temporary QA URL: ${remote_url}"
          echo "WARNING: empty QA data only; do not add real or sensitive data."
          trap - ERR

      - name: Publish the temporary URL
        uses: actions/upload-artifact@v4
        with:
          name: logue-remote-linux-url-${{ github.run_id }}
          path: ${{ runner.temp }}/logue-remote-url.txt
          retention-days: 1

      - name: Hold the disposable environment
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 5 --retry-delay 1 "${LOGUE_QA_REMOTE_URL}/v1/status" | grep -Fq '"ok":true'
          sleep "${{ inputs.hold_minutes }}m"

      - name: Stop the disposable environment
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${LOGUE_QA_TUNNEL_PID:-}" ]]; then
            kill "${LOGUE_QA_TUNNEL_PID}" >/dev/null 2>&1 || true
          fi
          service_pid_file="${LOGUE_QA_INSTALL_ROOT}/run/logue.pid"
          if [[ -f "${service_pid_file}" ]]; then
            service_pid="$(tr -dc '0-9' < "${service_pid_file}")"
            [[ -n "${service_pid}" ]] && kill "${service_pid}" >/dev/null 2>&1 || true
          fi
