name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: server/go.mod
      - name: Build release assets
        run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install.sh
            install-extension.sh
            dist/release/logue-extension.tar.gz
            dist/release/logue-darwin-arm64.tar.gz
            dist/release/logue-darwin-amd64.tar.gz
            dist/release/logue-linux-arm64.tar.gz
            dist/release/logue-linux-amd64.tar.gz
            dist/release/checksums.txt
