name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # The package is the Python Host, the built Web App and the built
      # Extension — no per-platform artifact, because nothing in it is compiled.
      - run: bash scripts/build-release.sh "${GITHUB_REF_NAME}"
      # The two installers ship as release assets so the README's command can
      # name a URL that resolves for every release, including `latest`.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install.sh
            install-extension.sh
            dist/release/logue.zip
            dist/release/checksums.txt
